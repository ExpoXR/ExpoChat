name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint + Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check app.py backend tests scripts/public_release_audit.py
      - name: Pytest
        run: python -m pytest -q
      - name: Dependency audit
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt -r requirements-worker.txt -r requirements-brain.txt
      - name: Public release audit
        run: python scripts/public_release_audit.py

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Node unit tests and dependency audit
        run: |
          npm test
          npm audit --audit-level=high
