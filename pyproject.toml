[project]
name = "expochat"
version = "0.1.0"
description = "Self-hosted supervisor for local Ollama workers with cloud Brain planning."
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# UP038 (isinstance with `X | Y`) is deprecated by ruff — the union form is slower at
# runtime than the tuple form, so we keep `isinstance(x, (int, float))` and skip the rule.
ignore = ["E501", "B008", "UP038"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
